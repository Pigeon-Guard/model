name: Train Model

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv sync --locked

      - name: Pull data with DVC
        run: |
          uv run dvc remote modify --local origin user marbetschar
          uv run dvc remote modify --local origin password "${{ secrets.MURENA_TOKEN }}"
          uv run dvc pull

      - name: Generate YOLO txt labels
        run: |
          uv run python dataset/generate_txt_labels.py

      - name: Run training script
        run: |
          uv run yolo settings wandb=True
          uv run python train.py
