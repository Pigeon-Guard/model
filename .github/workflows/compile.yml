name: Compile and Publish Production Model

on:
  repository_dispatch:
    types: [new-production]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv sync --locked

      - name: Extract artifact version info
        id: version
        run: |
          ARTIFACT="${{ github.event.client_payload.artifact_version }}"

          VERSION=$(echo "$ARTIFACT" | sed 's/.*:v/v/')
          TAG="yolo-model-${VERSION}"
          NAME="Model ${VERSION}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Download W&B artifact
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          uv run python - << 'EOF'
          import wandb

          api = wandb.Api()

          artifact_path = "${{ github.event.client_payload.artifact_version }}"

          print("Fetching:", artifact_path)

          artifact = api.artifact(artifact_path)
          dir_path = artifact.download()

          print("Downloaded to:", dir_path)

          with open("artifact_path.txt", "w") as f:
              f.write(dir_path)
          EOF

      - name: Read artifact path
        id: paths
        run: echo "dir=$(cat artifact_path.txt)" >> $GITHUB_OUTPUT

      - name: Rename PyTorch model
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp "${{ steps.paths.outputs.dir }}/best.pt" "yolo-model-${VERSION}.pt"

      - name: Export ONNX model
        run: |
          uv run python - << 'EOF'
          from ultralytics import YOLO

          version = "${{ steps.version.outputs.version }}"

          model = YOLO(f"yolo-model-{version}.pt")

          model.export(
              format="onnx",
              imgsz=224,
              opset=11,
              simplify=True
          )
          EOF

      - name: Test ONNX model
        run: |
          uv run python - << 'EOF'
          import numpy as np
          import onnx
          import onnxruntime as ort

          version = "${{ steps.version.outputs.version }}"
          onnx_path = f"yolo-model-{version}.onnx"

          model = onnx.load(onnx_path)
          onnx.checker.check_model(model)

          sess = ort.InferenceSession(onnx_path, providers=["CPUExecutionProvider"])
          input0 = sess.get_inputs()[0]
          name = input0.name
          shape = list(input0.shape)

          def _dim(i: int, d):
            if isinstance(d, int) and d > 0:
              return d
            if i == 0:
              return 1
            if i == 1:
              return 3
            return 224

          shape = [_dim(i, d) for i, d in enumerate(shape)]
          x = np.random.rand(*shape).astype(np.float32)

          outputs = sess.run(None, {name: x})
          if not outputs:
            raise RuntimeError("ONNX Runtime returned no outputs")
          for i, out in enumerate(outputs):
            arr = np.asarray(out)
            if arr.size == 0:
              raise RuntimeError(f"Output {i} is empty")
            if not np.isfinite(arr).all():
              raise RuntimeError(f"Output {i} contains non-finite values")

          print("ONNX smoke test OK")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          files: |
            yolo-model-${{ steps.version.outputs.version }}.pt
            yolo-model-${{ steps.version.outputs.version }}.onnx
